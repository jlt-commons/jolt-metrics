name: ci

on:
  push:
    branches: [main]
    # pushing a version tag releases it, once the tests pass
    tags: ['v*']
  pull_request:
  # "Run workflow" on main: tag the commit and release it, once the tests pass
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like v0.2.0'
        required: true
        type: string

# pinned: a new release would change what CI runs on
env:
  JOLT_VERSION: v0.8.24

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # metrics.git reads churn from the history
          fetch-depth: 0
      - name: Install jolt
        run: |
          sudo apt-get update
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6
          curl -sL https://raw.githubusercontent.com/jolt-lang/jolt/main/install | bash -s -- --version "$JOLT_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Tests
        run: jolt -M:test
      # the project's own report, kept with every green run and attached to releases
      - name: Metrics report
        run: |
          mkdir -p metrics-report
          jolt -m metrics.cli src metrics-report/report.html
          jolt -m metrics.cli src metrics-report/report.json
          jolt -m metrics.cli src metrics-report/report.md
          {
            echo '## Metrics summary'
            sed -n '/^## Summary/,/^## Refactoring queue/p' metrics-report/report.md | sed '1d;$d'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: metrics-report
          path: metrics-report/
          if-no-files-found: error

  release:
    needs: test
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      # the input for a manual run, the tag's name for a tag push
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check the version and where it points
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like v1.2.3, got '$VERSION'"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::run the release from main, not $GITHUB_REF"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
              echo "::error::tag $VERSION already exists"
              exit 1
            fi
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main"
            exit 1
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::release $VERSION already exists"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: metrics-report
          path: metrics-report
      - name: Release
        run: |
          gh release create "$VERSION" \
            --target "$GITHUB_SHA" \
            --title "$VERSION" \
            --generate-notes \
            metrics-report/report.html \
            metrics-report/report.json \
            metrics-report/report.md
