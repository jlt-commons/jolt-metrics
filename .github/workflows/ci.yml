name: ci

on:
  push:
    branches: [main]
  pull_request:

# pinned: a new release would change what CI runs on
env:
  JOLT_VERSION: v0.8.24

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # metrics.git reads churn from the history
          fetch-depth: 0
      - name: Install jolt
        run: |
          sudo apt-get update
          sudo apt-get install -y liblz4-1 zlib1g libtinfo6
          curl -sL https://raw.githubusercontent.com/jolt-lang/jolt/main/install | bash -s -- --version "$JOLT_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Tests
        run: jolt -M:test
